name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["A-share Intraday Refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  # cancel-in-progress: true — 高频推送（本机每15分钟 + CI）下，排队中的旧部署会被
  # 新请求挤掉却永远轮不到执行（2026-10-06 起站点冻结 3 天的根因）。改为取消进行中的
  # 旧部署、保证最新一次总能跑完，站点始终落到最新数据。
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点静态文件都在仓库根：index.html / data/ / vendor/ / pick.html
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
